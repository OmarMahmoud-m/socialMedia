<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loom — Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <!-- LOADER -->
    <div class="loader-div" id="loader">
      <div class="spinner"></div>
    </div>

    <!--========= Modals ============-->

    <!-- Login Modal -->
    <div class="modal fade" id="login-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Welcome back</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="username-input" class="col-form-label">Username</label>
                <input type="text" class="form-control" id="username-input" />
              </div>
              <div class="mb-3">
                <label for="password-input" class="col-form-label">Password</label>
                <input type="password" class="form-control" id="password-input" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary" onclick="login()">Login</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Register Modal -->
    <div class="modal fade" id="register-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Create your account</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="register-image-input" class="col-form-label">Profile Image</label>
                <input type="file" class="form-control" id="register-image-input" />
              </div>
              <div class="mb-3">
                <label for="register-name-input" class="col-form-label">Name</label>
                <input type="text" class="form-control" id="register-name-input" />
              </div>
              <div class="mb-3">
                <label for="register-username-input" class="col-form-label">Username</label>
                <input type="text" class="form-control" id="register-username-input" />
              </div>
              <div class="mb-3">
                <label for="register-password-input" class="col-form-label">Password</label>
                <input type="password" class="form-control" id="register-password-input" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary" onclick="register()">Register</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Create Post Modal -->
    <div class="modal fade" id="create-post-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="post-modal-title">Create a new post</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="post-title-input" class="col-form-label">Title</label>
                <input type="text" class="form-control" id="post-title-input" />
                <input type="hidden" id="post-id-input" value="" />
              </div>
              <div class="mb-3">
                <label for="post-body-input" class="col-form-label">What's on your mind?</label>
                <textarea id="post-body-input"></textarea>
              </div>
              <div class="mb-3">
                <label for="post-image-input" class="col-form-label">Image</label>
                <input type="file" class="form-control" id="post-image-input" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button id="post-modal-submit-btn" type="button" class="btn btn-primary" onclick="createPost()">Create</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Delete Post Modal -->
    <div class="modal fade" id="delete-post-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="post-modal-title">Delete this post?</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            <input type="hidden" id="delete-post-id-input" value="" />
          </div>
          <div class="modal-body">
            <p class="text-muted mb-0">This action can't be undone.</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button id="post-modal-submit-btn" type="button" class="btn btn-danger" onclick="confirmPostDelete()">Yes, Delete</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Alerts -->
    <div id="success-alert" class="show fade"></div>

    <!-- APP SHELL -->
    <div class="app-shell">

      <!-- SIDEBAR -->
      <nav class="navbar navbar-expand-lg sidebar">
        <div class="container-fluid sidebar-inner">
          <a class="navbar-brand" href="index.html"><span class="nav-label">Loom</span></a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="index.html"><i class="fa-solid fa-house"></i><span class="nav-label"> Home</span></a>
              </li>
              <li class="nav-item" id="profile-nav">
                <a class="nav-link" onclick="profileClicked()" style="cursor: pointer;"><i class="fa-solid fa-user"></i><span class="nav-label"> Profile</span></a>
              </li>
            </ul>
            <div id="login-div">
              <button type="button" id="login-btn" class="btn" data-bs-toggle="modal" data-bs-target="#login-modal"><i class="fa-solid fa-arrow-right-to-bracket"></i><span class="nav-label"> Login</span></button>
              <button type="button" id="register-btn" class="btn" data-bs-toggle="modal" data-bs-target="#register-modal"><i class="fa-solid fa-user-plus"></i><span class="nav-label"> Register</span></button>
            </div>
            <div id="logout-div">
              <div>
                <img src="noProfileImage.jpg" class="profile-img rounded-circle" id="navbar-user-image" alt="Your profile" />
                <span class="nav-label"><b id="navbar-user">Omar</b></span>
              </div>
              <button type="button" id="logout-btn" data-bs-toggle="modal" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i><span class="nav-label"> Logout</span></button>
            </div>
          </div>
        </div>
      </nav>

      <!-- MAIN CONTENT -->
      <main class="main-col">
        <div class="page-wrap">
          <div class="page-header">
            <h1>Home</h1>
            <p>See what everyone's sharing right now.</p>
          </div>

          <!-- Compose bar — id="add-post-btn" is exactly what main.js's
               setupUI() shows/hides and addButtonClicked() opens -->
          <div class="composer-trigger" id="add-post-btn" onclick="addButtonClicked()" title="Create post">
            <span class="composer-avatar-dot"><i class="fa-solid fa-pen"></i></span>
            <span class="composer-placeholder">Share something new…</span>
            <span class="composer-cta">Post</span>
          </div>

          <div class="posts"></div>
          <div id="scroll-sentinel" style="height: 1px;"></div>
        </div>
      </main>
    </div>

    <button class="back-to-top" id="back-to-top-btn" onclick="scrollToTop()" aria-label="Back to top">
      <i class="fa-solid fa-arrow-up"></i>
    </button>

    <script src="./js/main.js"></script>
  </body>
</html>
