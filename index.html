<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="./js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="./css/all.min.css" />
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <!--========= Modals ============-->

    <!-- Login Modal -->
    <div
      class="modal fade"
      id="login-modal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Login</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="recipient-name" class="col-form-label"
                  >Username:</label
                >
                <input type="text" class="form-control" id="username-input" />
              </div>
              <div class="mb-3">
                <label for="message-text" class="col-form-label"
                  >Password:</label
                >
                <input
                  type="password"
                  class="form-control"
                  id="password-input"
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" class="btn btn-primary" onclick="login()">
              Login
            </button>
          </div>
        </div>
      </div>
    </div>
    <!--// Login Modal //-->
    <!-- Register Modal -->
    <div
      class="modal fade"
      id="register-modal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">
              Register A New User
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="recipient-name" class="col-form-label">Profile Image:</label>
                <input
                  type="file"
                  class="form-control"
                  id="register-image-input"
                />
              </div>

              <div class="mb-3">
                <label for="recipient-name" class="col-form-label">Name:</label>
                <input
                  type="text"
                  class="form-control"
                  id="register-name-input"
                />
              </div>
              <div class="mb-3">
                <label for="recipient-name" class="col-form-label"
                  >Username:</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="register-username-input"
                />
              </div>
              <div class="mb-3">
                <label for="message-text" class="col-form-label"
                  >Password:</label
                >
                <input
                  type="password"
                  class="form-control"
                  id="register-password-input"
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" class="btn btn-primary" onclick="register()">
              Register
            </button>
          </div>
        </div>
      </div>
    </div>
    <!--// Register Modal //-->

    <!-- Create Post Modal -->
    <div
      class="modal fade"
      id="create-post-modal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">
              Create A New Post
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="recipient-name" class="col-form-label">Title</label>
                <input type="text" class="form-control" id="post-title-input" />
              </div>

              <div class="mb-3">
                <textarea id="post-body-input"> </textarea>
              </div>

              <div class="mb-3">
                <label for="recipient-name" class="col-form-label">Image</label>
                <input type="file" class="form-control" id="post-image-input" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="createPost()"
            >
              Create
            </button>
          </div>
        </div>
      </div>
    </div>
    <!--// Create Post Modal //-->
    <!--//============== Modals============ //-->

    <!-- Alerts -->
    <div id="success-alert" class="show fade"></div>
    <!--// Alerts //-->

    <!-- Add post Button -->
    <i
      class="fa-solid fa-circle-plus rounded-circle text-primary"
      id="add-post-btn"
      data-bs-toggle="modal"
      data-bs-target="#create-post-modal"
    ></i>
    <!--// Add post Button //-->

    <!-- NAV BAR -->
    <div class="container">
      <div class="d-flex justify-content-center">
        <div class="col-9">
          <nav
            class="navbar navbar-expand-lg bg-body-tertiary pt-3 shadow rounded"
          >
            <div class="container-fluid">
              <a class="navbar-brand" href="index.html">BookFace</a>
              <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                  <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#"
                      >Home</a
                    >
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="#">Profile</a>
                  </li>
                </ul>
                <!-- NON-LOGGED IN USER -->
                <div class="d-flex w-100 justify-content-end" id="login-div">
                  <button
                    type="button"
                    id="login-btn"
                    class="btn btn-outline-success mx-1"
                    data-bs-toggle="modal"
                    data-bs-target="#login-modal"
                  >
                    Login
                  </button>
                  <button
                    type="button"
                    id="register-btn"
                    class="btn btn-outline-success"
                    data-bs-toggle="modal"
                    data-bs-target="#register-modal"
                  >
                    Register
                  </button>
                </div>
                <!--// NON-LOGGED IN USER //-->

                <!-- FOR LOGGED IN USER -->
                 <div class="d-flex w-100 justify-content-end" id="logout-div">
                  <div class="d-flex align-items-center mx-3">
                    <img src="noProfileImage.jpg" class="profile-img rounded-circle border border-2 mx-1" id="navbar-user-image">
                    <b id="navbar-user">Omar</b>
                  </div>

                  <button
                    type="button"
                    id="logout-btn"
                    class="btn btn-outline-danger mx-1"
                    data-bs-toggle="modal"
                    onclick="logout()"
                  >
                    Logout
                  </button>
                </div>
                <!--// FOR LOGGED IN USER //-->
              </div>
            </div>
          </nav>
        </div>
      </div>
    </div>
    <!--// NAV BAR //-->

    <!-- MAIN CONTENT -->
    <div class="container mt-5">
      <div class="d-flex justify-content-center">
        <div class="col-9">
          <div class="posts">
            <!--POST-->

            <!--POST//-->
          </div>
        </div>
      </div>
    </div>
    <!--// MAIN CONTENT //-->
    <script src="./js/main.js"></script>
  </body>
</html>
